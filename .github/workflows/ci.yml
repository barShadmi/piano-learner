name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/audio-engine
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Never --all-features: the test-only `noop` feature switches the real addon code off.
      - run: cargo test
        working-directory: native/audio-engine
      - run: cargo clippy -- -D warnings
        working-directory: native/audio-engine
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: native/audio-engine
      # test:e2e runs `npm run build`, which builds the sound engine first.
      - run: xvfb-run -a npm run test:e2e

  windows-installer:
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/audio-engine
      - run: npm ci
      # dist:win builds the sound engine with ASIO. asio-sys needs LLVM (libclang) for bindgen.
      # asio-sys's own download unzips with PowerShell, which fails on the runner,
      # so fetch the Steinberg ASIO SDK here and point the build at it.
      - name: Get the ASIO SDK
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/asiosdk.zip" https://www.steinberg.net/asiosdk
          7z x -y -o"$RUNNER_TEMP/asiosdk" "$RUNNER_TEMP/asiosdk.zip" > /dev/null
          header=$(find "$RUNNER_TEMP/asiosdk" -name asiodrivers.h | head -n 1)
          test -n "$header"
          root=$(dirname "$(dirname "$header")")
          ls "$root"
          echo "CPAL_ASIO_DIR=$(cygpath -w "$root")" >> "$GITHUB_ENV"
      - run: npm run dist:win
        env:
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
      - name: Check the installer holds the sound engine
        shell: bash
        run: |
          ls -l release/win-unpacked/resources/native/
          test -f release/win-unpacked/resources/native/audio-engine.win32-x64-msvc.node
      - uses: actions/upload-artifact@v4
        with:
          name: PianoLearner-Setup
          path: release/*.exe
          retention-days: 14
          if-no-files-found: error
