appId: com.barshadmi.pianolearner
productName: PianoLearner
asar: true
directories:
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: native/audio-engine
    to: native
    filter:
      - '*.node'
  - from: assets/piano
    to: piano
    filter:
      - '*.ogg'
      - CREDITS.md
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: PianoLearner-Setup-${version}.exe
